
<html>
<head>
    <title>Сайт Ростика йоууууу</title>

    <style>
    /* Загальні налаштування сторінки */
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;

        /* Бекграунд */
        background: linear-gradient(135deg, #74ebd5, #9face6, #ff9a9e);
        background-size: cover;
        background-position: center;
        background-attachment: fixed;

        /* Центрування */
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;

        text-align: center;
        color: white;
    }

    /* Контейнер */
    .container {
        background: rgba(0, 0, 0, 0.35);
        padding: 30px;
        border-radius: 25px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    /* Заголовки */
    h1 {
        font-size: 40px;
        margin: 15px 0;
        text-shadow: 2px 2px 5px rgba(0,0,0,0.4);
    }

    /* Картинка */
    img {
        width: 250px;
        border-radius: 20px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        margin: 20px 0;
    }

    /* Кнопки */
    button {
        background: #ff6b6b;
        border: none;
        padding: 15px 25px;
        margin: 10px;
        border-radius: 30px;
        font-size: 18px;
        cursor: pointer;
    }

    button:hover {
        background: #ff4757;
    }

    /* Посилання */
    a {
        color: white;
        text-decoration: none;
        font-weight: bold;
    }
    </style>
</head>

</body>
</html>
